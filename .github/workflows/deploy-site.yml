name: Deploy site

# Publishes site/ as-is, without re-scraping. Useful for frontend-only changes
# (CSS/JS/HTML) and for getting the page live before a long data refresh
# finishes — the data itself is whatever is currently committed in site/data/.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'

# Shared with refresh-data.yml's deploy job (scoped to that job, so the long
# scrape never holds this group) so two Pages deployments can't overlap.
# Queue rather than cancel: cancelling a data-refresh deploy mid-flight would
# leave the site serving stale content until something else triggers a deploy.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
