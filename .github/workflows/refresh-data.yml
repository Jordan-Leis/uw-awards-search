name: Refresh awards data

on:
  schedule:
    # 06:00 UTC on Jan 1, May 1, and Sep 1 — three refreshes a year.
    - cron: '0 6 1 1,5,9 *'
  workflow_dispatch: {}

jobs:
  scrape-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        working-directory: scraper
    steps:
      # Full history so the commit step can fetch and reset onto the branch
      # tip; a default shallow (depth-1) checkout can't.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium + system deps
        run: python -m playwright install --with-deps chromium

      - name: Build the award index (search enumeration)
        run: python scrape_index.py

      - name: Fetch award details (resumable; retry to mop up flaky failures)
        run: |
          for attempt in 1 2 3; do
            echo "=== scrape_details.py attempt $attempt ==="
            python scrape_details.py || true
            remaining=$(python count_unscraped.py)
            echo "Awards still missing details: $remaining"
            if [ "$remaining" -eq 0 ]; then
              break
            fi
          done

      - name: Export data (validation gate — fails the job on a bad scrape)
        run: python export_data.py

      # main usually moves while this hour-long job runs. The exported files
      # are build outputs, not edits to be merged: a fresh scrape should just
      # win. So stash them outside the tree, hard-reset onto the current
      # branch tip, and put them back. Rebase/--autostash was tried first and
      # fails exactly when it matters — if the upstream commit also touched
      # site/data/*, popping the stash conflicts and leaves a conflicted index
      # that the commit step can't recover from.
      - name: Commit refreshed data
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          staged=$(mktemp -d)
          cp site/data/awards.json site/data/meta.json "$staged/"

          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

          cp "$staged/awards.json" "$staged/meta.json" site/data/

          if git diff --quiet -- site/data; then
            echo "Award data is unchanged since the last refresh; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/awards.json site/data/meta.json
          git commit -m "Data refresh: ${{ github.run_id }}"
          git push origin "HEAD:$GITHUB_REF_NAME"

  deploy:
    needs: scrape-and-export
    runs-on: ubuntu-latest
    # Shares deploy-site.yml's group so two Pages deployments can't overlap.
    # Scoped to this job, not the workflow, so the long scrape above doesn't
    # hold the group (and block quick frontend deploys) for its whole run.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out the branch tip (not the triggering SHA) so this picks up the
      # data commit the previous job just pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
