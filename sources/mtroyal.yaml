# Mount Royal University Awards — Blackbaud Award Management ("AcademicWorks") tenant.
#
# One of twelve live Canadian tenants sharing adapters/academicworks.py. No new
# parser: this file IS the integration.
#
# Discovered by tools/probe_academicworks.py, not by hand: both academicworks
# TLDs answer for every subdomain, so this tenant was invisible to the DNS sweep
# that "verified" the original five. Measured 788 awards at the time of
# writing.
#
# Calgary undergraduate university. 741 of its 788 entries carry status
# "Ended", so application_status is doing real work here: without it this source
# alone would add ~740 expired awards to every unfiltered search.

id: mtroyal
name: Mount Royal University Awards
short_name: Mount Royal
status: active

adapter: academicworks
academicworks_host: mtroyal.academicworks.ca
url: https://mtroyal.academicworks.ca/opportunities
source_url: https://mtroyal.academicworks.ca/opportunities

robots:
  checked: 2026-09-27
  allowed: true
  note: >-
    "User-Agent: * / Disallow:" — allow-all; only EasouSpider is blocked.
    Re-verified per host at fetch time by adapters/http.PoliteFetcher.

refresh: triannual

min_awards: 550
min_scraped_fraction: 0.5

defaults:
  residency:
    value: [AB]
    confidence: 0.4
    src: >-
      Weak, deliberately below the 0.75 exclusion threshold: an Alberta
      institution's awards mostly go to Alberta students, but that is a
      tendency and not a stated rule, so it must never exclude anyone on its
      own. Recorded so the signal exists once extraction can confirm it.
  institution:
    value: [mount-royal-university]
    confidence: 0.95
    src: >-
      Implicit: Mount Royal University's own award listing. A small number of
      entries are externally tenable, so this is 0.95 rather than 1.0.

disclaimer: >-
  Unofficial mirror of the Mount Royal University award listings. Not affiliated
  with or endorsed by Mount Royal University.
