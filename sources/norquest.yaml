# NorQuest College Awards — Blackbaud Award Management ("AcademicWorks") tenant.
#
# One of twelve live Canadian tenants sharing adapters/academicworks.py. No new
# parser: this file IS the integration.
#
# Discovered by tools/probe_academicworks.py, not by hand: both academicworks
# TLDs answer for every subdomain, so this tenant was invisible to the DNS sweep
# that "verified" the original five. Measured 109 awards at the time of
# writing.
#
# Smallest of the new tenants. Edmonton community college — included because
# it is nearly free to carry and because its awards skew toward financial need
# and newcomer status, which are exactly the eligibility facets the rest of the
# corpus is thin on.

id: norquest
name: NorQuest College Awards
short_name: NorQuest
status: active

adapter: academicworks
academicworks_host: norquest.academicworks.ca
url: https://norquest.academicworks.ca/opportunities
source_url: https://norquest.academicworks.ca/opportunities

robots:
  checked: 2026-09-27
  allowed: true
  note: >-
    "User-Agent: * / Disallow:" — allow-all; only EasouSpider is blocked.
    Re-verified per host at fetch time by adapters/http.PoliteFetcher.

refresh: triannual

min_awards: 75
min_scraped_fraction: 0.5

defaults:
  residency:
    value: [AB]
    confidence: 0.4
    src: >-
      Weak, deliberately below the 0.75 exclusion threshold: an Alberta
      institution's awards mostly go to Alberta students, but that is a
      tendency and not a stated rule, so it must never exclude anyone on its
      own. Recorded so the signal exists once extraction can confirm it.
  institution:
    value: [norquest-college]
    confidence: 0.95
    src: >-
      Implicit: NorQuest College's own award listing. A small number of
      entries are externally tenable, so this is 0.95 rather than 1.0.

disclaimer: >-
  Unofficial mirror of the NorQuest College award listings. Not affiliated
  with or endorsed by NorQuest College.
