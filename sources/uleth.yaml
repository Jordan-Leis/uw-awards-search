# University of Lethbridge Awards — Blackbaud Award Management ("AcademicWorks") tenant.
#
# One of twelve live Canadian tenants sharing adapters/academicworks.py. No new
# parser: this file IS the integration.
#
# Discovered by tools/probe_academicworks.py, not by hand: both academicworks
# TLDs answer for every subdomain, so this tenant was invisible to the DNS sweep
# that "verified" the original five. Measured 696 awards at the time of
# writing.
#
# Southern Alberta undergraduate university, and the closest of the new
# tenants to UofA in shape: a real four-year degree catalogue with faculty
# categories, so its area_of_study values are worth having.

id: uleth
name: University of Lethbridge Awards
short_name: ULethbridge
status: active

adapter: academicworks
academicworks_host: uleth.academicworks.ca
url: https://uleth.academicworks.ca/opportunities
source_url: https://uleth.academicworks.ca/opportunities

robots:
  checked: 2026-09-27
  allowed: true
  note: >-
    "User-Agent: * / Disallow:" — allow-all; only EasouSpider is blocked.
    Re-verified per host at fetch time by adapters/http.PoliteFetcher.

refresh: triannual

min_awards: 480
min_scraped_fraction: 0.5

defaults:
  residency:
    value: [AB]
    confidence: 0.4
    src: >-
      Weak, deliberately below the 0.75 exclusion threshold: an Alberta
      institution's awards mostly go to Alberta students, but that is a
      tendency and not a stated rule, so it must never exclude anyone on its
      own. Recorded so the signal exists once extraction can confirm it.
  institution:
    value: [university-of-lethbridge]
    confidence: 0.95
    src: >-
      Implicit: University of Lethbridge's own award listing. A small number of
      entries are externally tenable, so this is 0.95 rather than 1.0.

disclaimer: >-
  Unofficial mirror of the University of Lethbridge award listings. Not affiliated
  with or endorsed by University of Lethbridge.
