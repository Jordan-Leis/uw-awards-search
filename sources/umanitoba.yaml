# University of Manitoba Awards — Blackbaud Award Management ("AcademicWorks") tenant.
#
# Shares adapters/academicworks.py with the other four Canadian tenants; this
# file is the entire cost of adding it. Relevance to an out-of-province student
# is low (almost everything requires enrolment here), so this is breadth for
# the eventual national database rather than for the first-pass persona.

id: umanitoba
name: University of Manitoba Awards
short_name: UManitoba
status: planned  # registered and ready; not yet crawled

adapter: academicworks
academicworks_host: umanitoba.academicworks.ca
url: https://umanitoba.academicworks.ca/opportunities
source_url: https://umanitoba.academicworks.ca/opportunities

robots:
  checked: 2026-09-27
  allowed: true
  note: >-
    "User-Agent: * / Disallow:" — allow-all. Re-verified per host at fetch time
    by adapters/http.PoliteFetcher.

refresh: triannual

min_awards: 2000
min_scraped_fraction: 0.5

defaults:
  institution:
    value: [university-of-manitoba]
    confidence: 0.95
    src: "Implicit: University of Manitoba Awards own award listing."

disclaimer: >-
  Unofficial mirror of the University of Manitoba Awards listings. Not affiliated with or endorsed by
  the institution.
