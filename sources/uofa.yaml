# University of Alberta — Blackbaud Award Management ("AcademicWorks") tenant.
#
# One of five Canadian tenants sharing adapters/academicworks.py. Relevance to
# an out-of-province student is genuinely low: almost everything here requires
# enrolment at UofA. It is onboarded because it is nearly free (one parser, a
# handful of listing requests) and because it proves the multi-tenant path that
# UManitoba, Trent, USask and Concordia reuse verbatim.
#
# NOT YET SHIPPED. The listing alone truncates every description with an
# ellipsis, and truncated text is exactly how eligibility constraints go
# missing. Turning this on means running run_adapter.py without --no-detail
# (~2,400 requests, ~40 minutes) and flipping status back to active.
#
# Note the TLD: Canadian tenants are on .ca. The .com estate has a wildcard
# catch-all that redirects any subdomain, so probing it yields false positives,
# and western.academicworks.com is Western Colorado, not Western Ontario.

id: uofa
name: University of Alberta Awards
short_name: UAlberta
status: planned  # adapter proven; awaiting a full detail crawl

adapter: academicworks
academicworks_host: alberta.academicworks.ca
url: https://alberta.academicworks.ca/opportunities
source_url: https://alberta.academicworks.ca/opportunities

robots:
  checked: 2026-09-27
  allowed: true
  note: >-
    "User-Agent: * / Disallow:" — allow-all; only EasouSpider is blocked.
    Re-verified per host at fetch time by adapters/http.PoliteFetcher.

refresh: triannual

min_awards: 1500
min_scraped_fraction: 0.5

defaults:
  institution:
    value: [university-of-alberta]
    confidence: 0.95
    src: >-
      Implicit: the University of Alberta's own award listing. A small number
      of entries are externally tenable, so this is 0.95 rather than 1.0.

disclaimer: >-
  Unofficial mirror of the University of Alberta award listings. Not affiliated
  with or endorsed by the University of Alberta.
